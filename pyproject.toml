[project]
name = "embed-train-predict"
version = "0.1.0"
description = "Task-agnostic pipeline: embed texts with a language model, train lightweight classifiers on the embeddings, predict"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "torch>=2.13",
    "lightning>=2.6",
    "hydra-core>=1.3.4",
    "omegaconf>=2.3.1",
    "pandas>=3.0",
    "numpy>=2.5",
    "h5py>=3.16",
    "transformers>=5.13",
    "accelerate>=1.14",
    "safetensors>=0.8",
    "rich>=15.0",
    # data preparation, classifiers and evaluation reports
    "scikit-learn>=1.7",
    "scipy>=1.15",
]

# DeepSpeed (strategy=deepspeed, multi-node ZeRO-3) is installed separately
# because its build requires torch at install time:
#   uv pip install deepspeed --no-build-isolation

# The whole pipeline behind one command: `etp embed`, `etp train`, `etp predict`.
[project.scripts]
etp = "etp.cli.main:cli"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
