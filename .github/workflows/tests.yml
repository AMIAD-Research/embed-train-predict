name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Install ruff
        run: |
          uv venv
          uv pip install ruff

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      # CPU torch keeps the runner light; uv.lock stays CUDA-oriented for clusters.
      - name: Install dependencies
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . pytest

      - name: Run tests
        run: .venv/bin/pytest -q
